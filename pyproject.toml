[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "treelight"
version = "1.1.0"
description = "Quantifying three-dimensional artificial light at night (ALAN) exposure in urban tree canopies"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "openpyxl"
]

[tool.setuptools.packages.find]
where = ["src"]
